_jinja_extensions:
    - copier_template_extensions.TemplateExtensionLoader
    - context.py:ContextUpdater

_subdirectory:
  template

_message_before_copy: |
  This template creates a directory with scripts for performing and understanding a
  hyper-parameter search on plenoptic's synthesis objects. Intended uses include:

    - Find out which optimizer and learning rate result in the lowest loss.

    - Comparing alternative penalty functions in order to get synthesized image
      with some appearance.

    - Compare model variants to see which performs better.

  Several of the hyper-parameters accept special values. See README at
  https://github.com/plenoptic-org/hyperparameter-search-template
  for more details.

_message_after_copy: |
  Examine the created .py scripts in {{ _copier_conf.dst_path }} to see whether they
  look as intended. Intended workflow now is:

    - Run write_script.py to create a script with all the synthesize.py calls. Note
      the command-line arguments here (run write_script.py --help flag to see them),
      which you probably want to set.
    - Run the created script, either directly (to run all in sequence) or using a
      tool such as disBatch (to do so in parallel / on a cluster).
    - Run create_html.py to create an interactive visualization. Note that
      command-line arguments *must* be set, in order to tell us e.g., what to put
      on the x-axis, how to facet, etc.
    - Examine the created html file to determine what hyperparameters were
      most successful.
    - Repeat.

  See README at https://github.com/plenoptic-org/hyperparameter-search-template
  for more details.

synthesis_object:
  type: str
  help: Which type of synthesis object?
  choices:
    - Metamer
    - MetamerCTF
    - MADCompetition
    - Eigendistortion
    - GenericSynthesis

optimized_synthesis:
  when: false
  type: bool
  default: |
    {%- if synthesis_object == 'Eigendistortion' -%}
    false
    {% else %}
    true
    {%- endif -%}

init_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object == 'Metamer' -%}
    - image
    - model
    - loss_function
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'MetamerCTF' -%}
    - image
    - model
    - loss_function
    - penalty_function
    - penalty_lambda
    - coarse_to_fine
    {%- elif synthesis_object == 'MADCompetition' -%}
    - image
    - optimized_metric
    - reference_metric
    - minmax
    - metric_tradeoff_lambda
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - image
    - model
    {%- elif synthesis_object == 'GenericSynthesis' -%}
    - loss_function
    - penalty_function
    - penalty_lambda
    {%- endif -%}

setup_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MetamerCTF', 'GenericSynthesis'] -%}
    - initial_image
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'MADCompetition' -%}
    - initial_noise
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'Eigendistortion' -%}
    []
    {%- endif -%}

synth_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MADCompetition', 'GenericSynthesis'] -%}
    - max_iter
    - stop_criterion
    - stop_iters_to_check
    {%- elif synthesis_object == 'MetamerCTF' -%}
    - max_iter
    - stop_criterion
    - stop_iters_to_check
    - change_scale_criterion
    - ctf_iters_to_check
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - method
    - max_iter
    - k
    - p
    - q
    - stop_criterion
    {%- endif -%}

all_params:
  when: false
  type: yaml
  default: "{{ init_params + setup_params + synth_params + ['seed'] }}"

search_params:
  type: str
  help: Which hyperparameters to search over? These are in order, those passed to initialization, those passed to setup, those passed to synthesize.
  multiselect: true
  choices: |
    {%- for param in all_params %}
    - "{{ param }}"
    {%- endfor %}

---
# questions for the specific parameters
!include param_questions.yml
---

imshow_kwargs:
  type: yaml
  help: Any kwargs to pass to po.plot.synthesis_imshow?
  default: {}

animate:
  type: bool
  help: Would you like to save a video animating synthesis progress?
  default: False
  when: "{{ synthesis_object != 'Eigendistortion' }}"

animate_kwargs:
  type: yaml
  default: {}
  when: "{{ animate }}"
  help: Any kwargs to pass to po.plot.synthesis_animate?

status_plot:
  type: path
  help: Would you like to save a custom status plot? Leave blank to use plenoptic's built-in po.plot.synthesis_status

base_out:
  type: path
  help: Directory to save output into.
  default: /mnt/ceph/users/wbroderick/plenoptic_experiments/

cluster_prefix:
  type: str
  help: String to prepend to all commands for setting environmental variables. Intended to ensure that local caches are used consistently even when submitting jobs to a SLURM cluster.
  default: PYTORCH_KERNEL_CACHE_PATH=~/.cache/torch/kernels TORCH_HOME=~/.cache/torch MPLCONFIGDIR=~/.cache/matplotlib PLENOPTIC_CACHE_DIR=~/.cache/plenoptic

python_command:
  type: str
  default: uv run
  help: python command to use for running synthesize.py. If you use uv, this should be uv run. Else, should probably be python

cpu_only:
  type: bool
  default: False
  help: Will you only run this on the CPU? If yes, we'll tell uv to install torch from the cpu-only index.

extra_deps:
  type: json
  help: Any extra dependencies?
  default: []
