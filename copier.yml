_jinja_extensions:
    - copier_templates_extensions.TemplateExtensionLoader
    - extensions/context.py:ContextUpdater

_subdirectory:
  template

synthesis_object:
  type: str
  help: Which type of synthesis object?
  choices:
    - Metamer
    - MetamerCTF
    - MADCompetition
    - Eigendistortion

optimized_synthesis:
  when: false
  type: bool
  default: |
    {%- if synthesis_object == 'Eigendistortion' -%}
    false
    {% else %}
    true
    {%- endif -%}

init_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object == 'Metamer' -%}
    - image
    - model
    - loss_function
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'MetamerCTF' -%}
    - image
    - model
    - loss_function
    - penalty_function
    - penalty_lambda
    - coarse_to_fine
    {%- elif synthesis_object == 'MADCompetition' -%}
    - image
    - optimized_metric
    - reference_metric
    - minmax
    - metric_tradeoff_lambda
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - image
    - model
    {%- endif -%}

setup_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MetamerCTF'] -%}
    - initial_image
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'MADCompetition' -%}
    - initial_noise
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'Eigendistortion' -%}
    []
    {%- endif -%}

synth_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MADCompetition'] -%}
    - max_iter
    - stop_criterion
    - stop_iters_to_check
    {%- elif synthesis_object == 'MetamerCTF' -%}
    - max_iter
    - stop_criterion
    - stop_iters_to_check
    - change_scale_criterion
    - ctf_iters_to_check
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - method
    - max_iter
    - k
    - p
    - q
    - stop_criterion
    {%- endif -%}

all_params:
  when: false
  type: yaml
  default: "{{ init_params + setup_params + synth_params + ['seed'] }}"

search_params:
  type: str
  help: Which hyperparameters to search over? These are in order, those passed to initialization, those passed to setup, those passed to synthesize.
  multiselect: true
  choices: |
    {%- for param in all_params %}
    - "{{ param }}"
    {%- endfor %}

---
# questions for the specific parameters
!include param_questions.yml
---

animate:
  type: bool
  help: Would you like to save a video animating synthesis progress?
  default: False
  when: "{{ synthesis_object != 'Eigendistortion' }}"

status_plot:
  type: path
  help: Would you like to save a custom status plot? Leave blank to use plenoptic's built-in po.plot.synthesis_status

base_out:
  type: str
  help: Directory to save output into.
  default: /mnt/ceph/users/wbroderick/plenoptic_experiments/

cluster_prefix:
  type: str
  help: String to prepend to all commands for setting environmental variables. Intended to ensure that local caches are used consistently even when submitting jobs to a SLURM cluster.
  default: PYTORCH_KERNEL_CACHE_PATH=~/.cache/torch/kernels TORCH_HOME=~/.cache/torch MPLCONFIGDIR=~/.cache/matplotlib PLENOPTIC_CACHE_DIR=~/.cache/plenoptic
