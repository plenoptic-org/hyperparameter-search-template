_jinja_extensions:
    - copier_templates_extensions.TemplateExtensionLoader
    - extensions/context.py:ContextUpdater

_subdirectory:
  template

directory_name:
    type: str
    help: What should we name the directory?

synthesis_object:
  type: str
  help: Which type of synthesis object?
  choices:
    - Metamer
    - MetamerCTF
    - MADCompetition
    - Eigendistortion

init_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MetamerCTF'] -%}
    - image
    - model
    - loss_function
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'MADCompetition' -%}
    - image
    - optimized_metric
    - reference_metric
    - minmax
    - metric_tradeoff_lambda
    - penalty_function
    - penalty_lambda
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - image
    - model
    {%- endif -%}

setup_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MetamerCTF'] -%}
    - initial_image
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'MADCompetition' -%}
    - initial_noise
    - optimizer
    - optimizer_kwargs
    - scheduler
    - scheduler_kwargs
    {%- elif synthesis_object == 'Eigendistortion' -%}
    []
    {%- endif -%}

synth_params:
  when: false
  type: yaml
  multiline: true
  default: |
    {%- if synthesis_object in ['Metamer', 'MADCompetition'] -%}
    - max_iter
    - store_progress
    - stop_criterion
    - stop_iters_to_check
    {%- elif synthesis_object == 'MetamerCTF' -%}
    - max_iter
    - store_progress
    - stop_criterion
    - stop_iters_to_check
    - change_scale_criterion
    - ctf_iters_to_check
    {%- elif synthesis_object == 'Eigendistortion' -%}
    - method
    - k
    - p
    - q
    - stop_criterion
    {%- endif -%}

hyperparams:
  type: str
  help: Which hyperparameters to search over? These are in order, those passed to initialization, those passed to setup, those passed to synthesize.
  multiselect: true
  choices: |
    {%- for param in init_params + setup_params + synth_params %}
    - "{{ param }}"
    {%- endfor %}

---
# questions for the specific parameters
!include param_questions.yml
