# this toml is used for us to run tests
[project]
name = "hyperparameter-search-template"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts",
    "plenoptic",
    "altair",
    "pandas",
    "torch",
    "imageio",
    "pytest",
    "copier_template_extensions",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
